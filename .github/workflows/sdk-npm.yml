name: SDK npm packages

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tarballs: ${{ steps.pack.outputs.tarballs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install dependencies
        shell: bash
        run: |
          npm install --global pnpm@11.13.1
          pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Pack and test npm tarballs
        id: pack
        shell: bash
        run: |
          version=0.0.0-ci
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Expected a release tag of the form vMAJOR.MINOR.PATCH"
              exit 1
            fi
            version=${GITHUB_REF_NAME#v}
          fi
          artifacts="$RUNNER_TEMP/sdk-npm"
          tarballs=$(node scripts/pack-sdk-npm.mjs "$version" "$artifacts")
          consumer=$(mktemp -d)
          cd "$consumer"
          npm install --ignore-scripts --no-audit --no-fund tsx@4.23.15 "$artifacts"/*.tgz
          node --import tsx --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import "@spellkave/sdk";
          import "@spellkave/session/authoring";
          import "@spellkave/tool-authoring";
          import "@spellkave/tool-node/authoring";
          import "@spellkave/world-map";
          import { validateManifestToml } from "@spellkave/world-author";
          assert.deepEqual(validateManifestToml('#:schema https://spellkave.dev/schema/world-manifest-1.0.0.json\nschema_version = "1.0.0"\n'), []);
          JS
          echo "tarballs=$tarballs" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-npm
          path: ${{ runner.temp }}/sdk-npm/*.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        tarball: ${{ fromJSON(needs.build.outputs.tarballs) }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-npm
      - name: Publish tested tarball using npm Trusted Publishing
        env:
          TARBALL: ${{ matrix.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public
